  <style>

px;border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(circle at 30% 30%,#dce8ff,#9fbdff 58%,#8399ff);box-shadow:0 18px 28px rgba(99,126,218,.18);opacity:.88}.planet:after{content:'';position:absolute;inset:21px -13px;border-radius:50%;border:4px solid rgba(125,150,255,.65);transform:rotate(-25deg)}@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(4deg)}}.layout{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:'hero hero' 'side main'}.hero{grid-area:hero;position:relative;overflow:hidden;min-height:165px;margin:14px 14px 0;border-radius:32px;background:linear-gradient(135deg,#82e3dc 0%,#58c5f5 42%,#697fff 74%,#a985ff 100%);box-shadow:0 20px 48px rgba(96,124,222,.23);border:1px solid rgba(255,255,255,.42)}.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:24px 32px;color:#fff;min-height:165px}.hero-title{font-size:24px;font-weight:800;margin:0;line-height:1.2}.hero-subtitle{font-size:14px;margin:8px 0 0;opacity:.92;line-height:1.4}.hero-footer{position:absolute;bottom:16px;right:32px;font-size:12px;opacity:.8}.sidebar{grid-area:side;background:var(--glass2);border-right:1px solid var(--line);padding:20px 16px;overflow-y:auto;border-radius:0 20px 0 0}.main{grid-area:main;padding:32px;overflow-y:auto}.sidebar-item{display:block;padding:12px 16px;margin-bottom:8px;border-radius:12px;font-size:14px;font-weight:500;background:rgba(99,102,241,.1);color:var(--ink);cursor:pointer;transition:all .2s var(--ease)}.sidebar-item:hover{background:rgba(99,102,241,.2);transform:translateX(4px)}.sidebar-item.active{background:rgba(99,102,241,.25);color:#6366f1;font-weight:600}.category-list{margin-bottom:24px}.category-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:16px 0 8px;border-bottom:1px solid var(--line)}.app-card{background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;cursor:pointer;transition:all .3s var(--ease);position:relative}.app-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.app-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}.app-emoji{font-size:32px;min-width:40px;text-align:center}.app-title{font-size:16px;font-weight:700;color:var(--ink);flex:1}.app-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;background:rgba(255,182,111,.2);color:#ff8c42;white-space:nowrap}.app-guide{font-size:13px;line-height:1.5;color:var(--ink2);margin-bottom:12px}.app-link{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(99,102,241,.15);color:#6366f1;border-radius:8px;font-size:12px;font-weight:600;transition:all .2s var(--ease)}.app-link:hover{background:rgba(99,102,241,.25)}.loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);z-index:999}.spinner{width:48px;height:48px;border:4px solid rgba(99,102,241,.2);border-top:4px solid #6366f1;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.settings-panel{position:fixed;bottom:20px;left:20px;background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);z-index:100;max-width:250px}.settings-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;background:rgba(99,102,241,.15);border-radius:12px;color:#6366f1;font-weight:600;cursor:pointer;transition:all .2s var(--ease);margin-bottom:12px}.settings-btn:hover{background:rgba(99,102,241,.25)}.settings-label{font-size:12px;font-weight:600;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.settings-input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--glass2);color:var(--ink);margin-bottom:8px}.settings-button{width:100%;padding:8px;background:rgba(99,102,241,.2);border:1px solid rgba(99,102,241,.3);border-radius:8px;color:#6366f1;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);margin-bottom:4px}.settings-button:hover{background:rgba(99,102,241,.3)}.dropdown{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--glass2);color:var(--ink);margin-bottom:8px;cursor:pointer}.demo-badge{display:inline-block;padding:3px 8px;background:rgba(255,193,7,.2);color:#ffc107;font-size:11px;font-weight:600;border-radius:4px;margin-top:8px}@media (max-width:768px){.layout{grid-template-columns:1fr;grid-template-areas:'hero' 'main'}.sidebar{display:none}.hero{margin:8px}.main{padding:16px}.settings-panel{max-width:calc(100% - 40px)}.app-card{padding:16px}.app-title{font-size:14px}.hero-title{font-size:20px}}

<body>
  <div class="bg-grid"></div>
  <div class="blob left"></div>
  <div class="blob right"></div>
  <div class="planet"></div>

  <div class="layout">
    <div class="hero">
      <div class="hero-content">
        <h1 class="hero-title" id="heroTitle">우리 반 앱 포털</h1>
        <p class="hero-subtitle" id="heroSubtitle">오늘도 즐거운 탐험을 시작해요!</p>
        <div class="hero-footer" id="modeLabel" style="display:none;"></div>
      </div>
    </div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main" id="main">
      <div class="loader" id="loader">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <!-- 설정 메뉴 (학생용 링크로 접속하면 DOM에서 제거) -->
  <div class="settings-panel" id="settingsPanel" data-teacher-only>
    <div class="settings-btn" id="settingsToggle">⚙️</div>
    
    <div id="settingsContent" style="display:none;">
      <div class="settings-label">학생 선택</div>
      <select class="dropdown" id="studentSelect">
        <option value="">학생 선택...</option>
      </select>

      <div class="settings-label" style="margin-top:12px;">선생님 메뉴</div>
      <input type="text" class="settings-input" id="execUrl" placeholder="Apps Script exec URL">
      <button class="settings-button" id="connectBtn">연결하기</button>
      
      <div id="linkedInfo" style="display:none;margin-top:12px;padding:12px;background:rgba(76,175,80,.1);border-radius:8px;">
        <div style="font-size:11px;color:#388e3c;font-weight:600;margin-bottom:8px;">학생용 입장 링크:</div>
        <div id="studentLink" style="font-size:11px;color:var(--ink);word-break:break-all;margin-bottom:8px;padding:8px;background:rgba(255,255,255,.5);border-radius:4px;"></div>
        <button class="settings-button" id="copyLinkBtn">복사하기</button>
      </div>

      <div style="font-size:11px;color:var(--muted);margin-top:12px;">
        <div style="margin-bottom:4px;"><strong>도움말:</strong></div>
        <div>• Apps Script를 배포하면 exec 주소가 생깁니다</div>
        <div>• 그 주소를 입력하고 [연결하기]를 누르세요</div>
        <div>• 학생용 링크를 복사해 학생들에게 공유하세요</div>
      </div>
    </div>
  </div>

  <script>
    const _BUILD_SIG = 'GEGHS-DEEPE-2026';
    
    // ============================================================
    // 3-모드 자동 판별
    // ============================================================
    const APP_ID = 'launcher-portal';
    let MODE = 'demo'; // 'student' | 'connected' | 'demo'
    let execUrl = '';
    let currentStudent = '';

    // URL 해시에서 exec URL 추출 (#c=<URL>)
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const hashExecUrl = hashParams.get('c');

    if (hashExecUrl) {
      // 학생 링크로 접속 (선생님 메뉴 제거)
      MODE = 'student';
      execUrl = decodeURIComponent(hashExecUrl);
      _removeTeacherOnlyElements();
    } else {
      // localStorage에서 저장된 exec URL 확인
      const savedExecUrl = localStorage.getItem(`execUrl:${APP_ID}`);
      if (savedExecUrl && savedExecUrl.trim()) {
        MODE = 'connected';
        execUrl = savedExecUrl;
      }
      // 그 외는 데모 모드
    }

    // 현재 학생 복원 (localStorage)
    currentStudent = localStorage.getItem(`student:${APP_ID}`) || '';

    // ============================================================
    // 동적 스크립트 태그를 통한 서버 호출 (serverCall)
    // ============================================================
    let _callbackSeq = 0;
    function serverCall(action, data) {
      return new Promise((resolve, reject) => {
        _callbackSeq++;
        const cbName = `_apiRespond_${Date.now()}_${_callbackSeq}`;
        const timeoutId = setTimeout(() => {
          delete window[cbName];
          reject(new Error('Server call timeout (12s)'));
        }, 12000);

        window[cbName] = (result) => {
          clearTimeout(timeoutId);
          delete window[cbName];
          if (result && result.error) {
            reject(new Error(result.error));
          } else {
            resolve(result);
          }
        };

        const payload = JSON.stringify({ action, data });
        const script = document.createElement('script');
        script.src = `${execUrl}?action=${encodeURIComponent(action)}&data=${encodeURIComponent(payload)}&callback=${cbName}`;
        document.head.appendChild(script);
        
        setTimeout(() => {
          if (document.head.contains(script)) {
            document.head.removeChild(script);
          }
        }, 13000);
      });
    }

    // ============================================================
    // 데이터 로드 및 UI 렌더링
    // ============================================================
    async function loadAndRender() {
      try {
        let classInfo = {};
        let appData = {};
        let studentList = [];

        if (MODE === 'student' || MODE === 'connected') {
          // 서버에서 데이터 불러오기
          try {
            classInfo = await serverCall('getClassInfo', {});
          } catch (err) {
            console.warn('getClassInfo 실패:', err);
            classInfo = { className: '우리 반 앱 포털', motto: '오늘도 즐거운 탐험을 시작해요!' };
          }

          try {
            appData = await serverCall('getAppData', {});
          } catch (err) {
            console.warn('getAppData 실패:', err);
            appData = { categories: [], data: {} };
          }

          try {
            studentList = await serverCall('getStudentList', {});
          } catch (err) {
            console.warn('getStudentList 실패:', err);
            studentList = _getDefaultStudentList();
          }
        } else {
          // 데모 모드: 실제로 어떻게 보이는지 알 수 있게 예시 앱 카드를 채워 보여준다
          classInfo = { className: '우리 반 앱 포털', motto: '오늘도 즐거운 탐험을 시작해요!' };
          appData = {
            categories: ['국어', '과학·환경', '학급 활동'],
            data: {
              '국어': [
                { emoji: '✏️', name: '매일 글쓰기', guide: '오늘의 주제로 글을 쓰고 피드백을 받아요.', link: '#', badge: '체험' },
                { emoji: '📖', name: '독서 런닝타임', guide: '읽은 책과 시간을 기록하고 순위를 확인해요.', link: '#', badge: '체험' },
                { emoji: '🧩', name: '헷갈리는 낱말', guide: '비슷한 낱말의 뜻을 구별하는 놀이예요.', link: '#', badge: '체험' }
              ],
              '과학·환경': [
                { emoji: '🌍', name: '지구환경 지킴이', guide: '탄소중립 실천을 매일 기록해요.', link: '#', badge: '체험' },
                { emoji: '🦸', name: 'SDG 리틀 히어로', guide: '지속가능한 목표를 실천해요.', link: '#', badge: '체험' },
                { emoji: '🛡️', name: '안전 나침반', guide: '영역별 안전 영상을 보고 문제를 풀어요.', link: '#', badge: '체험' }
              ],
              '학급 활동': [
                { emoji: '💌', name: '마음 전달 우체국', guide: '친구에게 따뜻한 편지를 써요.', link: '#', badge: '체험' },
                { emoji: '🧭', name: '우리반 도우미', guide: '번호 뽑기, 타이머 같은 도구 모음이에요.', link: '#', badge: '체험' }
              ]
            }
          };
          studentList = _getDefaultStudentList();
        }

        // UI 업데이트
        document.getElementById('heroTitle').textContent = classInfo.className || '우리 반 앱 포털';
        document.getElementById('heroSubtitle').textContent = classInfo.motto || '오늘도 즐거운 탐험을 시작해요!';

        // 모드 표시
        const modeLabel = document.getElementById('modeLabel');
        if (MODE === 'demo') {
          modeLabel.textContent = '데모 모드';
          modeLabel.style.display = 'block';
        }

        // 학생 명단 드롭다운
        const studentSelect = document.getElementById('studentSelect');
        studentList.forEach(student => {
          const option = document.createElement('option');
          option.value = student;
          option.textContent = student;
          if (student === currentStudent) {
            option.selected = true;
          }
          studentSelect.appendChild(option);
        });

        // 사이드바 + 메인 컨텐츠
        const sidebar = document.getElementById('sidebar');
        const main = document.getElementById('main');
        main.innerHTML = '';

        (appData.categories || []).forEach(category => {
          const items = appData.data[category] || [];

          const categoryTitle = document.createElement('div');
          categoryTitle.className = 'category-title';
          categoryTitle.textContent = category;
          main.appendChild(categoryTitle);

          items.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';
            card.innerHTML = `
              <div class="app-header">
                <div class="app-emoji">${app.emoji || '🔗'}</div>
                <div class="app-title">${app.name}</div>
                ${app.badge ? `<div class="app-badge">${app.badge}</div>` : ''}
              </div>
              ${app.guide ? `<div class="app-guide">${app.guide}</div>` : ''}
              <a href="${app.link}" target="_blank" class="app-link">입장하기 →</a>
            `;
            main.appendChild(card);
          });
        });

        // 로더 제거
        const loader = document.getElementById('loader');
        if (loader) loader.style.display = 'none';
      } catch (err) {
        console.error('loadAndRender error:', err);
        document.getElementById('loader').style.display = 'none';
        document.getElementById('main').innerHTML = '<p style="color:red;">데이터를 불러올 수 없습니다.</p>';
      }
    }

    // ============================================================
    // 기본 학생 목록
    // ============================================================
    function _getDefaultStudentList() {
      const list = [];
      for (let i = 1; i <= 30; i++) {
        list.push('학생' + i);
      }
      return list;
    }

    // ============================================================
    // 학생 선택 변경
    // ============================================================
    document.getElementById('studentSelect').addEventListener('change', (e) => {
      currentStudent = e.target.value;
      localStorage.setItem(`student:${APP_ID}`, currentStudent);
    });

    // ============================================================
    // 설정 메뉴 토글
    // ============================================================
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsContent = document.getElementById('settingsContent');
    let settingsOpen = false;

    settingsToggle.addEventListener('click', () => {
      settingsOpen = !settingsOpen;
      settingsContent.style.display = settingsOpen ? 'block' : 'none';
    });

    // ============================================================
    // 연결하기 (exec URL 저장)
    // ============================================================
    document.getElementById('connectBtn').addEventListener('click', async () => {
      const url = document.getElementById('execUrl').value.trim();
      if (!url) {
        alert('exec URL을 입력해주세요.');
        return;
      }

      localStorage.setItem(`execUrl:${APP_ID}`, url);
      execUrl = url;
      MODE = 'connected';

      alert('연결되었습니다! 학생용 링크를 복사해 공유하세요.');

      // 학생용 링크 표시
      const studentLink = window.location.href.split('#')[0] + '#c=' + encodeURIComponent(url);
      document.getElementById('studentLink').textContent = studentLink;
      document.getElementById('linkedInfo').style.display = 'block';

      // 데이터 새로 로드
      setTimeout(() => {
        location.reload();
      }, 500);
    });

    // ============================================================
    // 학생용 링크 복사
    // ============================================================
    document.getElementById('copyLinkBtn').addEventListener('click', () => {
      const link = document.getElementById('studentLink').textContent;
      navigator.clipboard.writeText(link).then(() => {
        alert('학생용 링크가 복사되었습니다!');
      }).catch(() => {
        alert('복사 실패. 수동으로 복사하세요.');
      });
    });

    // ============================================================
    // 선생님 메뉴 제거 함수
    // ============================================================
    function _removeTeacherOnlyElements() {
      document.querySelectorAll('[data-teacher-only]').forEach(el => {
        el.remove();
      });
    }

    // ============================================================
    // 초기화 및 시작
    // ============================================================
    window.addEventListener('load', () => {
      loadAndRender();
    });
  </script>
<script>
/* 체험 모드 안내 배너 (런처형 문구) */
(function () {
  function isDemo() {
    try {
      if (/[#&]c=/.test(location.hash || '')) return false;
      for (var j = 0; j < localStorage.length; j++) {
        var k = localStorage.key(j) || '';
        if (/execurl|exec_url|exec:|gasurl|serverurl|sheet_api|gas_exec|appserverurl|endpoint/i.test(k) && localStorage.getItem(k)) return false;
      }
      return true;
    } catch (e) { return true; }
  }
  function show() {
    if (document.getElementById('__demoBar')) return;
    if (!isDemo()) return;
    var bar = document.createElement('div');
